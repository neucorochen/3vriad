<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bubble-chan Sweet Match-3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
  <script src="storage.js?v=4"></script>
  <script src="audio.js?v=4"></script>
  <script src="game.js?v=4"></script>
<body>
  <!-- Анимированный сладкий фон Frutiger Aero -->
  <div class="aero-bg" aria-hidden="true">
    <div class="sun-rays"></div>

    <svg class="aero-scene" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sweetSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#22b5ff" />
          <stop offset="48%" stop-color="#87e2ff" />
          <stop offset="82%" stop-color="#ffe0f2" />
          <stop offset="100%" stop-color="#fff4d9" />
        </linearGradient>

        <radialGradient id="sunGlow" cx="14%" cy="14%" r="36%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
          <stop offset="45%" stop-color="#fff2cc" stop-opacity="0.45" />
          <stop offset="100%" stop-color="#87e2ff" stop-opacity="0" />
        </radialGradient>

        <!-- Стеклянно-карамельные башни -->
        <linearGradient id="candyTower1" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#ffd4ec" />
          <stop offset="35%" stop-color="#ffffff" />
          <stop offset="68%" stop-color="#ff8ec7" />
          <stop offset="100%" stop-color="#d44d94" />
        </linearGradient>
        <linearGradient id="candyTower2" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#c4fff7" />
          <stop offset="35%" stop-color="#ffffff" />
          <stop offset="70%" stop-color="#4de0d1" />
          <stop offset="100%" stop-color="#199e9b" />
        </linearGradient>

        <!-- Мятно-кремовые холмы -->
        <linearGradient id="mintHill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#80f7c8" />
          <stop offset="100%" stop-color="#29bf8d" />
        </linearGradient>
        <linearGradient id="limeHill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9cf752" />
          <stop offset="100%" stop-color="#3bc427" />
        </linearGradient>

        <!-- Сиропное озеро -->
        <linearGradient id="syrupLake" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8beeff" />
          <stop offset="55%" stop-color="#3bc2f5" />
          <stop offset="100%" stop-color="#1e8ed6" />
        </linearGradient>
      </defs>

      <rect width="1440" height="900" fill="url(#sweetSky)" />
      <rect width="1440" height="900" fill="url(#sunGlow)" />

      <!-- Плывущие облака-зефирки -->
      <g class="cloud-group c-slow" fill="#ffffff" opacity="0.88">
        <ellipse cx="250" cy="140" rx="135" ry="38" />
        <ellipse cx="325" cy="122" rx="85" ry="34" />
        <ellipse cx="195" cy="128" rx="68" ry="28" />
      </g>
      <g class="cloud-group c-fast" fill="#fff5fb" opacity="0.82">
        <ellipse cx="920" cy="88" rx="145" ry="36" />
        <ellipse cx="995" cy="76" rx="82" ry="30" />
        <ellipse cx="1290" cy="125" rx="130" ry="38" />
      </g>

      <!-- Глянцевые карамельные башни справа -->
      <g opacity="0.92">
        <path d="M1055 680 L1080 190 Q1118 168 1152 190 L1176 680 Z" fill="url(#candyTower1)" />
        <path d="M1186 680 L1200 365 Q1220 350 1238 365 L1250 680 Z" fill="url(#candyTower2)" opacity="0.9" />
        <path d="M1264 680 L1288 265 L1310 680 Z" fill="url(#candyTower1)" opacity="0.84" />
      </g>

      <!-- Сиропное озеро слева -->
      <rect x="0" y="640" width="680" height="260" fill="url(#syrupLake)" />
      <g fill="#ffffff" opacity="0.38">
        <ellipse cx="165" cy="708" rx="120" ry="7" />
        <ellipse cx="305" cy="746" rx="92" ry="5" />
        <ellipse cx="125" cy="792" rx="140" ry="6" />
      </g>

      <!-- Мятные и лаймовые холмы -->
      <path d="M0 655 Q270 575 565 635 T1440 600 L1440 900 L0 900 Z" fill="url(#mintHill)" />
      <path d="M0 845 Q430 765 860 720 T1440 655 L1440 900 L0 900 Z" fill="url(#limeHill)" />
    </svg>

    <!-- Парящие глянцевые пузыри и леденцы -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
    <div class="bg-orb orb-4"></div>
    <div class="bg-candy candy-1"></div>
    <div class="bg-candy candy-2"></div>
    <div class="bg-candy candy-3"></div>
  </div>

  <!-- Главное окно Windows Aero -->
  <main class="aero-window">
    <header class="window-header">
      <div class="window-title">
        <span class="title-dot"></span>
        <h1>Bubble-chan Sweet Match-3</h1>
      </div>

      <div class="window-right">
        <div class="mode-pill">
          <span class="pill-led"></span>
          <span>сладкий режим</span>
        </div>
        <div class="win-controls" aria-hidden="true">
          <span class="win-btn min"></span>
          <span class="win-btn max"></span>
          <span class="win-btn close"></span>
        </div>
      </div>
    </header>

    <div class="window-body">
      <!-- Игровое поле -->
      <section class="board-stage">
        <div class="board-frame">
          <canvas id="gameCanvas" width="480" height="480"></canvas>
          <div id="floatingLayer" class="floating-layer" aria-hidden="true"></div>
        </div>
      </section>

      <!-- Боковая панель -->
      <aside class="sidebar">
        <div class="glass-card stats-card">
          <div class="card-title">статистика</div>
          <div class="stat-row">
            <span>очки</span>
            <strong id="scoreVal">0</strong>
          </div>
          <div class="stat-row">
            <span>рекорд</span>
            <strong id="bestVal">0</strong>
          </div>
          <div class="stat-row">
            <span>комбо</span>
            <strong id="comboVal">x1</strong>
          </div>
        </div>

        <div class="glass-card energy-card">
          <div class="card-title">сладкое комбо</div>
          <div class="progress-track">
            <div id="comboBar" class="progress-fill"></div>
          </div>
          <button id="hintBtn" class="jelly-btn lime-btn" type="button">
            ✨ подсказка
          </button>
        </div>

        <div class="glass-card controls-card">
          <div class="card-title">управление</div>
          <div class="btn-group">
            <button id="musicBtn" class="jelly-btn aqua-btn" type="button">
              🎵 музыка: выкл
            </button>
            <button id="restartBtn" class="jelly-btn aqua-btn" type="button">
              🔄 начать заново
            </button>
          </div>
          <p class="controls-hint">
            свайп или клик — поменять десерты<br />
            4 в ряд — сияющий десерт · 5 — радужный торт
          </p>
        </div>

        <!-- Маскот с репликами -->
        <div class="mascot-zone">
          <div id="mascotBubble" class="speech-bubble" role="status" aria-live="polite">
            Собери 3 вкусняшки в ряд!
          </div>
          <img
            id="mascotImg"
            src="mascot.png"
            alt="Bubble-chan маскот"
            class="mascot-img"
            onerror="this.style.display='none'"
          />
        </div>
      </aside>
    </div>
  </main>

  <script src="storage.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
